<!doctype html><html><body style="margin:0;background:#222"><canvas id="c"></canvas><pre id="out" style="position:fixed;color:white;background:#000a"></pre><script src="vendor/playcanvas.min.js"></script><script>
const out=document.getElementById('out');const log=(...x)=>{out.textContent+=x.join(' ')+'\n';console.log(...x)};
(async()=>{try{const canvas=document.getElementById('c');const app=new pc.Application(canvas,{graphicsDeviceOptions:{antialias:true,preferWebGl2:true}});app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);app.start();app.scene.ambientLight=new pc.Color(.4,.4,.4);const cam=new pc.Entity();cam.addComponent('camera',{clearColor:new pc.Color(.2,.3,.4)});cam.setPosition(0,2,6);cam.lookAt(0,1,0);app.root.addChild(cam);const light=new pc.Entity();light.addComponent('light',{type:'directional',intensity:2});light.setEulerAngles(45,30,0);app.root.addChild(light);
const load=(url,type)=>new Promise((res,rej)=>{const a=new pc.Asset(url,type,{url});a.on('load',()=>res(a));a.on('error',e=>rej(e));app.assets.add(a);app.assets.load(a)});
const gate=await load('embedded/gate.glb','container');log('gate keys',Object.keys(gate.resource));const ge=gate.resource.instantiateRenderEntity({castShadows:true});app.root.addChild(ge);ge.setLocalScale(10,10,10);log('gate renders',ge.findComponents('render').length);
const hero=await load('assets/'+encodeURIComponent('\u200e\u2068\u0633\u064a\u0646_\u0648\u0642\u0648\u0641_\u0633\u0627\u0643\u0646_\u0633\u064a\u0646\u0645\u0627\u064a\u0654\u064a\u2069')+'.glb','container');log('hero keys',Object.keys(hero.resource));log('animations',hero.resource.animations.map(a=>({name:a.name,keys:Object.keys(a),res:a.resource&&Object.keys(a.resource),type:a.constructor.name}))); const he=hero.resource.instantiateRenderEntity({castShadows:true});app.root.addChild(he);he.setPosition(3,0,0);he.setLocalScale(1.85,1.85,1.85);he.addComponent('anim',{activate:true});he.anim.loadStateGraph({layers:[{name:'Base',states:[{name:'START',speed:1},{name:'idle',speed:1,loop:true,defaultState:true}],transitions:[{from:'START',to:'idle'}]}],parameters:{}});he.anim.baseLayer.assignAnimation('idle',hero.resource.animations[0].resource);he.anim.baseLayer.play('idle');log('anim assigned',he.anim.baseLayer.activeState);
window.probe={app,gate,hero,ge,he};window.ready=true;}catch(e){log('ERROR',e.stack||e);window.err=String(e)}})();
</script></body></html>
